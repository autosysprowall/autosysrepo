name: Power Automate Resource Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --disable-pip-version-check msal==1.33.0 requests==2.32.4

      - name: Discover Office Script identifiers
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET || secrets.MS_GRAPH_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          import requests
          from msal import ConfidentialClientApplication

          app = ConfidentialClientApplication(
              os.environ["MS_CLIENT_ID"],
              authority=f"https://login.microsoftonline.com/{os.environ['MS_TENANT_ID']}",
              client_credential=os.environ["MS_CLIENT_SECRET"],
          )
          result = app.acquire_token_for_client(
              scopes=["https://graph.microsoft.com/.default"]
          )
          token = result.get("access_token")
          if not token:
              raise RuntimeError(result.get("error_description", "Graph auth failed"))
          headers = {"Authorization": f"Bearer {token}"}
          next_url = (
              "https://graph.microsoft.com/v1.0/users/"
              "auto.sys@prowallpanama.com/drive/root/delta"
              "?$select=id,name,parentReference,file"
          )
          found = []
          while next_url:
              response = requests.get(next_url, headers=headers, timeout=60)
              response.raise_for_status()
              page = response.json()
              found.extend(
                  item
                  for item in page.get("value", [])
                  if item.get("name", "").casefold()
                  in {"getganttstatus.osts", "setganttstatus.osts"}
              )
              next_url = page.get("@odata.nextLink")
          for item in found:
              parent = item.get("parentReference") or {}
              print(
                  f"OFFICE_SCRIPT name={item.get('name')} "
                  f"id={item.get('id')} driveId={parent.get('driveId')}"
              )
          if not any(
              item.get("name", "").casefold() == "getganttstatus.osts"
              for item in found
          ):
              raise RuntimeError("GetGanttStatus.osts no encontrado.")
          PY

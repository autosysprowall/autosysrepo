name: Sistema 1 - Poll SharePoint Queue

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "Cantidad maxima de items recientes a leer"
        required: false
        default: "50"
      max_items:
        description: "Cantidad maxima de pendientes a procesar"
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: sistema1-poll-sharepoint-queue
  cancel-in-progress: false

jobs:
  poll-queue:
    name: Process Cola_Automatizacion_Proyectos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MS_GRAPH_TENANT_ID: ${{ vars.MS_GRAPH_TENANT_ID }}
      MS_GRAPH_CLIENT_ID: ${{ vars.MS_GRAPH_CLIENT_ID }}
      MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
      SP_SITE_HOSTNAME: ${{ vars.SP_SITE_HOSTNAME }}
      SP_SITE_PATH: ${{ vars.SP_SITE_PATH }}
      SP_QUEUE_LIST_NAME: ${{ vars.SP_QUEUE_LIST_NAME }}
      SP_QUEUE_LIST_ID: ${{ vars.SP_QUEUE_LIST_ID }}
      SP_CONTROL_LIST_NAME: ${{ vars.SP_CONTROL_LIST_NAME || 'Control_Gantt_Asignaciones' }}
      SP_CONTROL_LIST_ID: ${{ vars.SP_CONTROL_LIST_ID }}
      SP_ACTIVE_PROJECTS_ROOT: ${{ vars.SP_ACTIVE_PROJECTS_ROOT || 'Proyectos/Proyectos Activos' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_ACTIVITY_PLANNER_MODE: ${{ vars.OPENAI_ACTIVITY_PLANNER_MODE || 'live' }}
      OPENAI_ACTIVITY_PLANNER_MODEL: ${{ vars.OPENAI_ACTIVITY_PLANNER_MODEL || 'gpt-4o-mini' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Microsoft Graph auth configuration
        id: graph-auth
        run: |
          if [ -z "$MS_GRAPH_CLIENT_SECRET" ]; then
            echo "::warning::MS_GRAPH_CLIENT_SECRET is not configured. Skipping SharePoint queue poll until the Entra app client secret is added to GitHub Secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Process SharePoint queue
        if: steps.graph-auth.outputs.ready == 'true'
        run: |
          python scripts/sistema1_poll_queue.py \
            --top "${{ github.event.inputs.top || '50' }}" \
            --max-items "${{ github.event.inputs.max_items || '5' }}" \
            --process

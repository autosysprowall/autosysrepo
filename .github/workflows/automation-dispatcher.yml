name: SharePoint Automation Dispatcher

on:
  workflow_dispatch:
    inputs:
      top:
        description: "Cantidad maxima de items recientes a leer"
        required: false
        default: "50"
      max_items:
        description: "Cantidad maxima de pendientes a procesar"
        required: false
        default: "5"
      item_id:
        description: "ID opcional de un item para reprocesarlo manualmente"
        required: false
        default: ""
      control_item_id:
        description: "ID opcional para limitar Sistema 2 a un solo proyecto"
        required: false
        default: ""
      force_version_recheck:
        description: "Reevaluar versionado del control indicado (requiere B6 Entregar)"
        required: false
        type: boolean
        default: false
      skip_system1:
        description: "Omitir Sistema 1 durante una prueba aislada de tracking"
        required: false
        type: boolean
        default: false
      skip_system2:
        description: "Ejecutar solo Sistema 1, sin permisos, correos ni tracking"
        required: false
        type: boolean
        default: false
      reset_system1_data:
        description: "Vaciar cola y Proyectos Activos, y reencolar presupuestos oficiales"
        required: false
        type: boolean
        default: false
      reset_queue_only:
        description: "Vaciar solo la cola y reencolar Presupuestos Aprobados"
        required: false
        type: boolean
        default: false
      clear_queue_only:
        description: "Vaciar solo la cola sin reencolar archivos"
        required: false
        type: boolean
        default: false
      reset_related_tracking:
        description: "Reiniciar control/notificaciones solo para presupuestos reencolados"
        required: false
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: sharepoint-automation-dispatcher
  cancel-in-progress: false

jobs:
  process:
    name: Dispatch Sistema 1 and Sistema 2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Sanity check dispatcher
        run: python src/automation_dispatcher.py --help

      - name: Validate required secrets
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET || secrets.MS_GRAPH_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=()
          for name in MS_TENANT_ID MS_CLIENT_ID MS_CLIENT_SECRET OPENAI_API_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}. Configure them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Required secrets are configured."

      - name: Validate email templates and delivery mode
        env:
          NOTIFICATION_DELIVERY_MODE: ${{ vars.NOTIFICATION_DELIVERY_MODE || 'test' }}
          NOTIFICATION_TEST_RECIPIENT: ${{ vars.NOTIFICATION_TEST_RECIPIENT || 'auto.sys@prowallpanama.com' }}
          ENGINEER_GUIDE_URL: ${{ vars.ENGINEER_GUIDE_URL }}
          GANTT_ESCALATION_CC: ${{ vars.GANTT_ESCALATION_CC || 'jaime.madrid@prowallpanama.com;enrique.correa@prowallpanama.com' }}
        run: python scripts/validate_email_delivery.py

      - name: Reset Sistema 1 data and requeue official budgets
        if: github.event_name == 'workflow_dispatch' && inputs.reset_system1_data && !inputs.clear_queue_only
        env:
          MS_GRAPH_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET || secrets.MS_GRAPH_CLIENT_SECRET }}
          SP_SITE_HOSTNAME: ${{ vars.SP_SITE_HOSTNAME || 'sciprowall.sharepoint.com' }}
          SP_SITE_PATH: ${{ vars.SP_SITE_PATH || '/sites/PROYECTOSPROWALL' }}
          SP_QUEUE_LIST_NAME: ${{ vars.SP_QUEUE_LIST_NAME || 'Cola_Automatizacion_Proyectos' }}
          SP_QUEUE_LIST_ID: ${{ vars.SP_QUEUE_LIST_ID }}
          SP_CONTROL_LIST_NAME: ${{ vars.SP_CONTROL_LIST_NAME || 'Control_Gantt_Asignaciones' }}
          SP_CONTROL_LIST_ID: ${{ vars.SP_CONTROL_LIST_ID }}
          SP_NOTIFICATION_LIST_NAME: ${{ vars.SP_NOTIFICATION_LIST_NAME || 'Cola_Notificaciones_Gantt' }}
          SP_NOTIFICATION_LIST_ID: ${{ vars.SP_NOTIFICATION_LIST_ID }}
          SP_ACTIVE_PROJECTS_ROOT: Proyectos/Proyectos Activos
          SP_APPROVED_BUDGETS_ROOT: Proyectos/Presupuestos Aprobados
        run: |
          args=(
            --execute
            --confirm-active-root "Proyectos/Proyectos Activos"
          )
          if [ "${{ inputs.reset_related_tracking }}" = "true" ]; then
            args+=(--reset-related-tracking)
          fi
          python scripts/sistema1_reset_and_requeue.py "${args[@]}"

      - name: Reset queue only and requeue approved budgets
        if: github.event_name == 'workflow_dispatch' && inputs.reset_queue_only && !inputs.reset_system1_data && !inputs.clear_queue_only
        env:
          MS_GRAPH_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET || secrets.MS_GRAPH_CLIENT_SECRET }}
          SP_SITE_HOSTNAME: ${{ vars.SP_SITE_HOSTNAME || 'sciprowall.sharepoint.com' }}
          SP_SITE_PATH: ${{ vars.SP_SITE_PATH || '/sites/PROYECTOSPROWALL' }}
          SP_QUEUE_LIST_NAME: ${{ vars.SP_QUEUE_LIST_NAME || 'Cola_Automatizacion_Proyectos' }}
          SP_QUEUE_LIST_ID: ${{ vars.SP_QUEUE_LIST_ID }}
          SP_CONTROL_LIST_NAME: ${{ vars.SP_CONTROL_LIST_NAME || 'Control_Gantt_Asignaciones' }}
          SP_CONTROL_LIST_ID: ${{ vars.SP_CONTROL_LIST_ID }}
          SP_NOTIFICATION_LIST_NAME: ${{ vars.SP_NOTIFICATION_LIST_NAME || 'Cola_Notificaciones_Gantt' }}
          SP_NOTIFICATION_LIST_ID: ${{ vars.SP_NOTIFICATION_LIST_ID }}
          SP_ACTIVE_PROJECTS_ROOT: Proyectos/Proyectos Activos
          SP_APPROVED_BUDGETS_ROOT: Proyectos/Presupuestos Aprobados
        run: |
          args=(
            --execute
            --queue-only
            --confirm-active-root "Proyectos/Proyectos Activos"
          )
          if [ "${{ inputs.reset_related_tracking }}" = "true" ]; then
            args+=(--reset-related-tracking)
          fi
          python scripts/sistema1_reset_and_requeue.py "${args[@]}"

      - name: Clear queue without requeue
        if: github.event_name == 'workflow_dispatch' && inputs.clear_queue_only
        env:
          MS_GRAPH_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET || secrets.MS_GRAPH_CLIENT_SECRET }}
          SP_SITE_HOSTNAME: ${{ vars.SP_SITE_HOSTNAME || 'sciprowall.sharepoint.com' }}
          SP_SITE_PATH: ${{ vars.SP_SITE_PATH || '/sites/PROYECTOSPROWALL' }}
          SP_QUEUE_LIST_NAME: ${{ vars.SP_QUEUE_LIST_NAME || 'Cola_Automatizacion_Proyectos' }}
          SP_QUEUE_LIST_ID: ${{ vars.SP_QUEUE_LIST_ID }}
          SP_ACTIVE_PROJECTS_ROOT: Proyectos/Proyectos Activos
          SP_APPROVED_BUDGETS_ROOT: Proyectos/Presupuestos Aprobados
        run: |
          python scripts/sistema1_reset_and_requeue.py \
            --execute \
            --queue-only \
            --clear-only \
            --confirm-active-root "Proyectos/Proyectos Activos"

      - name: Run SharePoint automation dispatcher
        env:
          MS_GRAPH_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET || secrets.MS_GRAPH_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SP_SITE_HOSTNAME: ${{ vars.SP_SITE_HOSTNAME || 'sciprowall.sharepoint.com' }}
          SP_SITE_PATH: ${{ vars.SP_SITE_PATH || '/sites/PROYECTOSPROWALL' }}
          SP_QUEUE_LIST_NAME: ${{ vars.SP_QUEUE_LIST_NAME || 'Cola_Automatizacion_Proyectos' }}
          SP_QUEUE_LIST_ID: ${{ vars.SP_QUEUE_LIST_ID }}
          SP_CONTROL_LIST_NAME: ${{ vars.SP_CONTROL_LIST_NAME || 'Control_Gantt_Asignaciones' }}
          SP_CONTROL_LIST_ID: ${{ vars.SP_CONTROL_LIST_ID }}
          NOTIFICATION_DELIVERY_MODE: ${{ vars.NOTIFICATION_DELIVERY_MODE || 'test' }}
          NOTIFICATION_TEST_RECIPIENT: ${{ vars.NOTIFICATION_TEST_RECIPIENT || 'auto.sys@prowallpanama.com' }}
          ENGINEER_GUIDE_URL: ${{ vars.ENGINEER_GUIDE_URL }}
          GANTT_ESCALATION_CC: ${{ vars.GANTT_ESCALATION_CC || 'jaime.madrid@prowallpanama.com;enrique.correa@prowallpanama.com' }}
          SP_ACTIVE_PROJECTS_ROOT: Proyectos/Proyectos Activos
          OPENAI_ACTIVITY_PLANNER_MODE: ${{ vars.OPENAI_ACTIVITY_PLANNER_MODE || 'live' }}
          OPENAI_ACTIVITY_PLANNER_MODEL: ${{ vars.OPENAI_ACTIVITY_PLANNER_MODEL || 'gpt-4o-mini' }}
        run: |
          args=(
            --top "${{ github.event.inputs.top || '50' }}"
            --max-items "${{ github.event.inputs.max_items || '5' }}"
            --item-id "${{ github.event.inputs.item_id || '' }}"
            --control-item-id "${{ github.event.inputs.control_item_id || '' }}"
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_system1 }}" = "true" ]; then
            args+=(--skip-system1)
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_system2 }}" = "true" ]; then
            args+=(--skip-system2)
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_version_recheck }}" = "true" ]; then
            args+=(--force-version-recheck)
          fi
          python src/automation_dispatcher.py "${args[@]}"

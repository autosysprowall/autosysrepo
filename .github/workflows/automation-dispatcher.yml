name: SharePoint Automation Dispatcher

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "Cantidad maxima de items recientes a leer"
        required: false
        default: "50"
      max_items:
        description: "Cantidad maxima de pendientes a procesar"
        required: false
        default: "5"
      item_id:
        description: "ID opcional de un item para reprocesarlo manualmente"
        required: false
        default: ""
      control_item_id:
        description: "ID opcional para limitar Sistema 2 a un solo proyecto"
        required: false
        default: ""
      skip_system1:
        description: "Omitir Sistema 1 durante una prueba aislada de tracking"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sharepoint-automation-dispatcher
  cancel-in-progress: false

jobs:
  process:
    name: Dispatch Sistema 1 and Sistema 2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Sanity check dispatcher
        run: python src/automation_dispatcher.py --help

      - name: Validate required secrets
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET || secrets.MS_GRAPH_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=()
          for name in MS_TENANT_ID MS_CLIENT_ID MS_CLIENT_SECRET OPENAI_API_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}. Configure them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Required secrets are configured."

      - name: Run SharePoint automation dispatcher
        env:
          MS_GRAPH_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET || secrets.MS_GRAPH_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SP_SITE_HOSTNAME: ${{ vars.SP_SITE_HOSTNAME || 'sciprowall.sharepoint.com' }}
          SP_SITE_PATH: ${{ vars.SP_SITE_PATH || '/sites/PROYECTOSPROWALL' }}
          SP_QUEUE_LIST_NAME: ${{ vars.SP_QUEUE_LIST_NAME || 'Cola_Automatizacion_Proyectos' }}
          SP_QUEUE_LIST_ID: ${{ vars.SP_QUEUE_LIST_ID }}
          SP_CONTROL_LIST_NAME: ${{ vars.SP_CONTROL_LIST_NAME || 'Control_Gantt_Asignaciones' }}
          SP_CONTROL_LIST_ID: ${{ vars.SP_CONTROL_LIST_ID }}
          NOTIFICATION_DELIVERY_MODE: ${{ vars.NOTIFICATION_DELIVERY_MODE || 'test' }}
          NOTIFICATION_TEST_RECIPIENT: ${{ vars.NOTIFICATION_TEST_RECIPIENT || 'auto.sys@prowallpanama.com' }}
          SP_ACTIVE_PROJECTS_ROOT: Proyectos/Proyectos Activos
          OPENAI_ACTIVITY_PLANNER_MODE: ${{ vars.OPENAI_ACTIVITY_PLANNER_MODE || 'live' }}
          OPENAI_ACTIVITY_PLANNER_MODEL: ${{ vars.OPENAI_ACTIVITY_PLANNER_MODEL || 'gpt-4o-mini' }}
        run: |
          args=(
            --top "${{ github.event.inputs.top || '50' }}"
            --max-items "${{ github.event.inputs.max_items || '5' }}"
            --item-id "${{ github.event.inputs.item_id || '' }}"
            --control-item-id "${{ github.event.inputs.control_item_id || '' }}"
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_system1 }}" = "true" ]; then
            args+=(--skip-system1)
          fi
          python src/automation_dispatcher.py "${args[@]}"
